<title>Från nuläge till beslut</title>
<style>
/*FONTS*/
/* Layout: filmen i full bredd, kontroller och kapitel under. Ett enda mörkt utseende, samma tre färger som filmen. */
:root{
  --bg:#18262F; --panel:#213340; --line:#35505F;
  --fg:#FFFFFF; --muted:#C3CFD6;
  --accent:#D1403B; --ok:#A9DCC8;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font:500 16px/1.5 var(--display);padding-inline:max(16px,3vw);padding-block:28px 48px}
.wrap{max-width:1360px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.player{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.player canvas{display:block;width:100%;height:100%}
.player:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center}
.player:fullscreen canvas{width:100vw;height:100vh;object-fit:contain}
.big{position:absolute;inset:0;margin:auto;width:clamp(72px,11vw,128px);height:clamp(72px,11vw,128px);border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s ease}
.big:hover{transform:scale(1.06)}
.big svg{width:42%;height:42%;margin-left:6%}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.btn{font:800 15px/1 var(--display);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:12px 20px;cursor:pointer;min-width:96px}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn:hover{border-color:var(--fg)}
.btn:focus-visible,.big:focus-visible,.chap button:focus-visible,#seek:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--accent);height:28px}
#time{font:500 14px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chap{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chap button{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.chap button:hover{color:var(--fg);border-color:var(--muted)}
.chap button[aria-current="true"]{color:var(--bg);background:var(--ok);border-color:var(--ok)}
.meta{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
@media (prefers-reduced-motion: reduce){.big{transition:none}}
</style>

<div class="wrap">
  <div class="player" id="player">
    <canvas id="c" width="1920" height="1080" role="img" aria-label="Animerad film om dataplattformen: från källsystem via Azure Data Factory, Databricks och dbt till Fabric, rapporter och AI."></canvas>
    <button class="big" id="big" type="button" aria-label="Spela filmen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18l16-9z" fill="currentColor"/></svg></button>
  </div>
  <div class="ctrl">
    <button class="btn primary" id="pp" type="button">Spela</button>
    <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Tidslinje">
    <span id="time">0:00 / 0:00</span>
    <button class="btn" id="mute" type="button" aria-pressed="false">Ljud på</button>
    <button class="btn" id="fs" type="button">Helskärm</button>
  </div>
  <audio id="snd" src="soundtrack.mp3" preload="auto"></audio>
  <ul class="chap" id="chap"></ul>
  <p class="meta">Mellanslag spelar och pausar. Piltangenterna hoppar fem sekunder. Musiken och ljudeffekterna är syntetiserade för filmen. Bilar, priser, anläggningar och siffror är exempel.</p>
</div>

<script>
/*FILM*/
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),F=window.Film,D=F.duration;
  var pp=document.getElementById('pp'),seek=document.getElementById('seek'),time=document.getElementById('time'),big=document.getElementById('big'),player=document.getElementById('player'),chap=document.getElementById('chap');
  var snd=document.getElementById('snd'),mute=document.getElementById('mute'),sound=true;
  var POSTER=F.chapters[1][1]+3.4,t=POSTER,playing=false,started=false,last=0;
  snd.addEventListener('error',function(){sound=false;mute.hidden=true;});
  function sndSeek(){if(!sound)return;try{snd.currentTime=Math.min(t,(snd.duration||D)-.05);}catch(e){}}
  function sndPlay(){if(!sound)return;sndSeek();try{var r=snd.play();if(r&&r.catch)r.catch(function(){});}catch(e){}}
  function sndPause(){try{snd.pause();}catch(e){}}
  F.attach(ctx);seek.max=D.toFixed(2);
  function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
  function ui(){
    pp.textContent=playing?'Pausa':(started&&t>=D-.05?'Spela igen':'Spela');
    time.textContent=fmt(started?t:0)+' / '+fmt(D);
    if(started)seek.value=t;
    var cur=0;F.chapters.forEach(function(c,i){if(t>=c[1]-.01)cur=i;});
    Array.prototype.forEach.call(chap.children,function(li,i){li.firstChild.setAttribute('aria-current',started&&i===cur?'true':'false');});
  }
  function draw(){F.render(t);}
  function loop(now){
    if(!playing)return;
    t+=Math.min(.1,(now-last)/1000);last=now;
    /* ljudet är klocka: bilden följer efter om de glider isär */
    if(sound&&!snd.paused&&snd.readyState>=2){var drift=snd.currentTime-t;if(Math.abs(drift)>.12)t=snd.currentTime;else t+=drift*.08;}
    if(t>=D){t=D;playing=false;sndPause();}
    draw();ui();
    if(playing)requestAnimationFrame(loop);
  }
  function play(){if(!started||t>=D-.05){t=0;}started=true;big.hidden=true;playing=true;last=performance.now();sndPlay();ui();requestAnimationFrame(loop);}
  function pause(){playing=false;sndPause();ui();}
  function toggle(){playing?pause():play();}
  function jump(to){started=true;big.hidden=true;t=Math.max(0,Math.min(D,to));sndSeek();draw();ui();}
  mute.addEventListener('click',function(){snd.muted=!snd.muted;mute.textContent=snd.muted?'Ljud av':'Ljud på';mute.setAttribute('aria-pressed',snd.muted?'true':'false');});
  pp.addEventListener('click',toggle);big.addEventListener('click',play);cv.addEventListener('click',toggle);
  seek.addEventListener('input',function(){jump(parseFloat(seek.value));});
  document.getElementById('fs').addEventListener('click',function(){
    try{if(document.fullscreenElement){document.exitFullscreen();}else if(player.requestFullscreen){var r=player.requestFullscreen();if(r&&r.catch)r.catch(function(){});}}catch(e){}
  });
  document.addEventListener('keydown',function(e){
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.target!==seek)return;
    if(e.code==='Space'){e.preventDefault();toggle();}
    else if(e.code==='ArrowRight'){e.preventDefault();jump(t+5);}
    else if(e.code==='ArrowLeft'){e.preventDefault();jump(t-5);}
  });
  F.chapters.forEach(function(c){var li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=c[0];b.addEventListener('click',function(){jump(c[1]+.01);if(!playing)play();});li.appendChild(b);chap.appendChild(li);});
  function first(){draw();ui();}
  window.__ready=(document.fonts&&document.fonts.load?Promise.all(['900 80px "Schibsted Grotesk"','800 80px "Schibsted Grotesk"','500 80px "Schibsted Grotesk"','500 40px "JetBrains Mono"'].map(function(f){return document.fonts.load(f,'Åäö 0123');})):Promise.resolve()).then(first,first);
  first();
})();
</script>
