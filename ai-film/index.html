/* Layout: filmen i full bredd, kontroller och kapitel under. Ett enda mörkt utseende, samma tre färger som filmen. */
:root{
  --bg:#18262F; --panel:#213340; --line:#35505F;
  --fg:#FFFFFF; --muted:#C3CFD6;
  --accent:#D1403B; --ok:#A9DCC8;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font:500 16px/1.5 var(--display);padding-inline:max(16px,3vw);padding-block:28px 48px}
.wrap{max-width:1360px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.player{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.player canvas{display:block;width:100%;height:100%}
.player:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center}
.player:fullscreen canvas{width:100vw;height:100vh;object-fit:contain}
.big{position:absolute;inset:0;margin:auto;width:clamp(72px,11vw,128px);height:clamp(72px,11vw,128px);border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s ease}
.big:hover{transform:scale(1.06)}
.big svg{width:42%;height:42%;margin-left:6%}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.btn{font:800 15px/1 var(--display);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:12px 20px;cursor:pointer;min-width:96px}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn:hover{border-color:var(--fg)}
.btn:focus-visible,.big:focus-visible,.chap button:focus-visible,#seek:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--accent);height:28px}
#time{font:500 14px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chap{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chap button{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.chap button:hover{color:var(--fg);border-color:var(--muted)}
.chap button[aria-current="true"]{color:var(--bg);background:var(--ok);border-color:var(--ok)}
.meta{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
@media (prefers-reduced-motion: reduce){.big{transition:none}}
</style>
